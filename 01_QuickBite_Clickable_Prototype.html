<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBite — Concept Prototype</title><style>body{margin:0;background:#eef5f4;font:16px system-ui;color:#14243b}main{max-width:420px;margin:35px auto;background:white;border-radius:23px;padding:25px;box-shadow:0 15px 55px #19394622}h1{font-size:22px;color:#137b73}.progress{display:flex;gap:8px}.progress span{flex:1;height:6px;background:#dde8e7;border-radius:5px}.progress .active{background:#137b73}.tile{border:1px solid #d9e5e3;border-radius:12px;padding:15px;margin:12px 0}button{background:#137b73;border:none;color:white;font:inherit;font-weight:bold;padding:14px;border-radius:12px;cursor:pointer;width:100%}button.secondary{background:#ecf4f3;color:#137b73;margin-top:9px}label{display:block;margin:12px 0}input{accent-color:#137b73}small{color:#657487}#content{min-height:230px}</style><main><h1>quickbite.</h1><small>Interactive concept · not a live ordering service</small><h2 id="title">Cart</h2><div class="progress" id="progress"></div><div id="content"></div><button id="next" onclick="advance()">Continue</button><button class="secondary" onclick="back()">Back</button></main><script>let step=0;const screens=[['Your cart','<div class="tile">🥗 2 × Veggie Bowls <b style="float:right">$24.00</b></div><div class="tile">Subtotal $24.00<br>Estimated delivery $4.00<br><b>Estimated total $28.00</b></div>'],['Delivery address','<div class="tile"><label><input type="radio" checked name="address"> Home — 120 Market St (sample)</label><label><input type="radio" name="address"> Work — 25 West Ave (sample)</label></div><div class="tile">Delivery notes: Leave at door</div>'],['Delivery option','<div class="tile"><label><input type="radio" checked name="delivery"> Standard · 30–40 min</label><label><input type="radio" name="delivery"> Priority · 20–30 min (illustrative)</label></div>'],['Payment method','<div class="tile"><label><input type="radio" name="pay" checked> Demo card ending 4242</label><label><input type="radio" name="pay"> Pay on delivery (demo)</label></div><small>Do not enter actual payment information.</small>'],['Review order','<div class="tile">2 × Veggie Bowls<br>Sample delivery address<br>Sample payment method<hr>Subtotal: $24.00<br>Delivery: $4.00<br><b>Total: $28.00</b></div>'],['Order submitted (demo)','<div class="tile">✓ Success! This is a prototype only. No order was placed and no payment was processed.</div>']];function draw(){document.getElementById('title').textContent=screens[step][0];document.getElementById('content').innerHTML=screens[step][1];document.getElementById('progress').innerHTML=[0,1,2].map(i=>'<span class="'+(i<=Math.min(2,Math.floor(step/2))?'active':'')+'"></span>').join('');document.getElementById('next').textContent=step===4?'Submit demo order':step===5?'Start over':'Continue';}function advance(){step=step===5?0:step+1;draw()}function back(){step=Math.max(0,step-1);draw()}draw()</script></html>
